id = "mpc2000"
name = "Akai MPC2000"
family = "mpc"
released = "1997"
coverage = "partial"
summary = "OS 1.72 (MPC2000.EXE and MPC2000.SYS) is identified by hash. Its address model, about 50 OS routines and software interrupts, in-RAM program, sequence and voice layouts and disk services are recorded: entry points checked against the bytes, meanings from a published mod source. Hardware, boot path and memory map are not documented. Nothing is hardware-tested here."

[[fact]]
key = "os_update"
value = "An OS update is two files, mpc2000.exe and mpc2000.sys, on a DOS-format floppy"
status = "documented"
source = "Sweetwater SweetCare: MPC2000 Operating System Update Instructions"

[[fact]]
key = "os_final"
value = "The final OS for the MPC2000 Classic is 1.72"
status = "documented"
source = "Gearnews, MPC2000 Mods article (2026)"

[[fact]]
key = "hardware_family"
value = "Described together with the 2000XL as a cost-reduced MPC3000: NEC V53, uPD72068 floppy, MB89352 SCSI optional, LC7981 LCD, uPD78C10 panel CPU, L7A1045 DSP"
status = "hypothesis"
source = "MAME mpc2000.cpp header comment; MAME defines only the 2000XL, so this is unchecked for the Classic"

[[fact]]
key = "os_files"
value = "OS 1.72 is two DOS MZ files: MPC2000.EXE (header 0xE00 bytes) and MPC2000.SYS (header 0x2800 bytes)"
status = "static"
source = "findings/os-files.md; hashes in firmware.toml"

[[fact]]
key = "main_cpu"
value = "NEC V53"
status = "documented"
source = "vubeatz mpc2000_2000xl_mod_pack (commit eb8ece6), mods/08_regions.S comments; not checked against a board"

[[fact]]
key = "voices"
value = "32 voices; 44.1 kHz sample rate"
status = "documented"
source = "vubeatz mpc2000_2000xl_mod_pack (commit eb8ece6); findings/os-services.md"

[[fact]]
key = "program_layout"
value = "In RAM a program is a 30-byte header and 64 note records of 29 bytes (notes 35-98); 24 programs in an arena at segment 5A00"
status = "static"
source = "findings/program-and-voice-data.md (x29 arithmetic and arena immediates read from the EXE; record fields documented)"

[[fact]]
key = "storage_names"
value = "Floppy and SCSI use FAT with 16+3 character names; characters 9-16 are stored in directory entry bytes 12-19"
status = "documented"
source = "findings/filesystem.md"

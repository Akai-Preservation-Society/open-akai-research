label = "OS 3.08 (EPROM pair)"
origin = "manufacturer"
kind = "eprom-pair"
obtain = "Read the two OS EPROMs (IC13 = LS, IC14 = MS, AM27C020) of a machine you own with an EPROM programmer."
notes = "Not in the MAME ROM set. Loads .SYS files at segment 7000."

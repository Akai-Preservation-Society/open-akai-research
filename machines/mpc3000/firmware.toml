# Firmware registry for the Akai MPC3000.
#
# This file identifies images. It never contains them. Hashes let you (and
# `python3 tools/oar.py identify`) tell which image a file is.
#
# A "linear" image is the two EPROMs interleaved: even bytes from the LS
# chip, odd bytes from the MS chip. All file offsets in findings, symbols
# and pins refer to the linear image.

[[image]]

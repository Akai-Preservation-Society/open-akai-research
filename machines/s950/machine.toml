id = "s950"
name = "Akai S950"
family = "s-series"
released = "1988"
coverage = "seed"
summary = "Hardware, memory map, I/O ports and known ROM images are recorded from MAME's driver source (documented, not verified here). Nothing about the OS code is published."

[[fact]]
key = "main_cpu"
value = "NEC V30 at 8 MHz (16 MHz crystal / 2)"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]

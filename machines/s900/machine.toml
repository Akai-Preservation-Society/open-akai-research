id = "s900"
name = "Akai S900"
family = "s-series"
released = "1986"
coverage = "seed"
summary = "Hardware from MAME and Akai's CPU-board addendum; ROM 1.2a whole-image hashes checked against a dump, and a 1.2b set and the OS 4.0 boot disk registered by hash. Booting a replacement OS from floppy is documented (S900FX, OS 4.0). Nothing about the OS code is published."

[[fact]]
key = "main_cpu"
value = "NEC V30 at 8 MHz (16 MHz crystal / 2)"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "dma"
value = "Three uPD71071 DMA controllers: one for sampling and transfers, two for voice playback"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "timers"
value = "Three 8254 sample-rate timers and three 8253 filter timers"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "interrupts"
value = "8259 interrupt controller"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "midi"
value = "6850 ACIA"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "display"
value = "2x40 character LCD, HD44780-class (type and clock guessed by MAME)"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "audio"
value = "12-bit ADC and 12-bit DACs; output and input filters (MF6-50) not emulated"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "floppy"
value = "uPD7265 controller, 3.5-inch DD drive"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "serial"
value = "8251 USART for the RS232 port"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "os_storage"
value = "Two 16 KiB EPROMs (IC12 LS even, IC11 MS odd), 32 KiB, visible at 0x80000-0x87FFF and mirrored to 0xFFFFF while the ROM is mapped"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working"

[[fact]]
key = "rom_unmap"
value = "Writing port 0x08 with bit 3 set unmaps the ROM so the whole 1 MiB is RAM; this is how MAME models it"
status = "documented"
source = "MAME src/mame/akai/s900.cpp at commit c2caa8969adb (2026-11-13); emulator source, driver flagged not working (media_ctrl_w)"

[[fact]]
key = "os_from_disk"
value = "Later OS versions (2.0, 4.0) are distributed as boot floppies, so the machine loads an OS into RAM from disk"
status = "documented"
source = "wiw.org/~meta/s2k.php (S900 OS v4.0 disk image)"

[[fact]]
key = "cpu_board_parts"
value = "uPD70116C, uPD71011C clock, uPD71051C serial unit, uPD71059C ICU, uPD71071C DMA, uPD7265C FDC, SED9420C data separator, HD6850P ACIA, 28x MN41256A DRAM, TMM27128 (16 KiB) and TMM2764 (8 KiB) EPROMs"
status = "documented"
source = "Akai S900 Service Manual (Additional), CPU PCB IC table; findings/hardware-overview.md"

[[fact]]
key = "memory"
value = "750 KB internal memory; sampling 7.5-40 kHz"
status = "documented"
source = "Akai S900 Owner's Manual, Specifications"

[[fact]]
key = "user_code_entry"
value = "The stock ROM 1.2 loads a DD boot floppy into RAM at power-on or from DISK page 01; the OS 4.0 disk and S900FX use this. No ROM change is needed"
status = "documented"
source = "S900FX README 2026.10.16; findings/boot-disks.md"

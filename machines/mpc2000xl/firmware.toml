# Firmware registry for the Akai MPC2000XL.
#
# This file identifies images. It never contains them. File offsets in this
# machine's folder are offsets into the 512 KiB OS image (which is also the
# update file MPC2KXL.BIN). Physical address = 0x80000 + file offset.

[[image]]
id = "mpc2000xl-os1.20"
label = "OS 1.20 (MPC2KXL.BIN / flash image)"
origin = "manufacturer"
kind = "flash"
obtain = "Akai's final OS update file for this model, MPC2KXL.BIN. Obtain it from a source you trust and check the hash, or read IC20 of a machine you own."
notes = "Its internal build string still reads 1.14c -74 Jul. 15,2004. The update file is this image byte for byte. Every code-level finding in this folder is keyed to it."

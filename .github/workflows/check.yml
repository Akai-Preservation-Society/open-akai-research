name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the knowledge base
        run: python3 tools/oar.py check
      - name: Test the tools
        run: python3 -m unittest discover -s tests -v
